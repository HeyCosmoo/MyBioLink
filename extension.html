<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cosmo's Biolink - Extension Download">
    <meta name="keywords" content="cosmo, HCF, minecraft, Biolink, extension">
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="32x32" href="assets/images/favicon-32x32.png" type="image/png">
    <link rel="icon" sizes="16x16" href="assets/images/favicon-16x16.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" type="image/png">
    <link rel="icon" sizes="192x192" href="assets/images/android-chrome-192x192.png" type="image/png">
    <link rel="icon" sizes="512x512" href="assets/images/android-chrome-512x512.png" type="image/png">
    <title>Cosmo - Extension</title>
    <style>
        /* ---------- MINIMALISTIC RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: #ffffff;
            min-height: 100vh;
        }

        /* main container — minimal spacing */
        .main-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 24px 64px;
        }

        /* heading */
        .extension-heading {
            text-align: center;
            margin-bottom: 32px;
        }

        .extension-heading h1 {
            font-size: 2.8rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .divider {
            width: 64px;
            height: 2px;
            background: rgba(255,255,255,0.2);
            margin: 16px auto 0;
        }

        /* DOWNLOAD BUTTON — centered, clean, minimal */
        .download-btn-wrapper {
            text-align: center;
            margin: 28px 0 32px;
        }

        .download-btn {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 14px 36px;
            border-radius: 48px;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: -0.2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .download-btn:hover {
            background: #ffcc00;
            color: #000000;
            transform: scale(0.98);
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        /* TUTORIAL VIDEO — minimal rounded frame */
        .tutorial-section {
            margin: 32px 0 24px;
        }

        .video-label {
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 400;
            color: #aaa;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 18px;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        /* minimalist caption */
        .tutorial-caption {
            text-align: center;
            margin-top: 14px;
            font-size: 0.85rem;
            color: #999;
            font-weight: 400;
        }

        .info-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #666;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* footer minimal */
        footer {
            text-align: center;
            padding: 24px 20px 32px;
            font-size: 0.7rem;
            color: #3a3a3a;
        }

        /* responsive */
        @media (max-width: 680px) {
            .main-container {
                padding: 80px 20px 56px;
            }
            .extension-heading h1 {
                font-size: 2.2rem;
            }
            .download-btn {
                font-size: 1.1rem;
                padding: 12px 28px;
            }
        }

        /* subtle animation for content */
        .main-container {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* no extra elements, no background video, no audio */
    </style>
</head>
<body>

    <main class="main-container">
        <!-- minimal heading -->
        <div class="extension-heading">
            <h1>Extension</h1>
            <div class="divider"></div>
        </div>

        <!-- DOWNLOAD BUTTON ONLY -->
        <div class="download-btn-wrapper">
            <button id="directDownloadBtn" class="download-btn">📦 Download extension</button>
        </div>

        <!-- TUTORIAL VIDEO MIDDLE (exact video from catbox) -->
        <div class="tutorial-section">
            <div class="video-label">tutorial</div>
            <div class="video-wrapper">
                <video controls preload="metadata" poster="">
                    <source src="https://files.catbox.moe/ff0yol.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="tutorial-caption">
                How to install — watch the tutorial above
            </div>
        </div>

        <div class="info-note">
            After downloading, unzip → load unpacked at chrome://extensions (developer mode)
        </div>
    </main>

    <footer>
        <span>cosmo</span>
    </footer>

    <!-- DIRECT DOWNLOAD SCRIPT: straight to downloads folder with CORRECT GitHub raw URL -->
    <script>
        (function() {
            // ✅ CORRECTED URL: Using GitHub raw content link for direct download
            // Your RoServer.zip is located at: https://github.com/HeyCosmoo/MyBioLink/blob/main/assets/Extension/RoServer.zip
            // The RAW download URL is:
            const EXTENSION_FILE_URL = "https://github.com/HeyCosmoo/MyBioLink/raw/main/assets/Extension/RoServer.zip";
            
            const downloadBtn = document.getElementById('directDownloadBtn');
            
            // Function to trigger instant download to "Downloads" folder
            function triggerDirectDownload(url, fallbackName) {
                // Create a hidden anchor element with download attribute
                const link = document.createElement('a');
                link.href = url;
                let filename = fallbackName;
                if (!filename) {
                    // extract filename from URL
                    let parts = url.split('/');
                    let last = parts.pop();
                    if (last && last.includes('.')) filename = last;
                    else filename = 'RoServer.zip';
                }
                link.download = filename;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            
            // Handle download click event
            function handleDownload(e) {
                e.preventDefault();
                
                try {
                    // Trigger direct download using the GitHub raw URL
                    triggerDirectDownload(EXTENSION_FILE_URL, 'RoServer.zip');
                    console.log("✅ Download started from:", EXTENSION_FILE_URL);
                } catch (err) {
                    console.error("Download error:", err);
                    alert("⚠️ Could not start download automatically.\n\nPlease right-click the button and select 'Save link as...' or try again.\n\nFile URL: " + EXTENSION_FILE_URL);
                }
            }
            
            if (downloadBtn) {
                downloadBtn.addEventListener('click', handleDownload);
            }
            
            console.log("✨ Extension page ready — download will fetch from GitHub raw URL");
        })();
    </script>

    <!-- animated title effect (same as old friends.html, keeps minimal charm) -->
    <script>
        var rev = "fwd";
        function titlebar(val){
            var msg  = "COSMO";
            var speed = 500;
            var pos = val;
            var le = msg.length;
            if(rev == "fwd"){
                if(pos < le){
                    pos = pos+1;
                    scroll = msg.substr(0,pos);
                    document.title = scroll;
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
                else {
                    rev = "bwd";
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
            }
            else {
                if(pos > 0) {
                    pos = pos-1;
                    var ale = le-pos;
                    scrol = msg.substr(ale,le);
                    document.title = scrol;
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
                else {
                    rev = "fwd";
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
            }
        }
        titlebar(0);
    </script>
</body>
</html>
