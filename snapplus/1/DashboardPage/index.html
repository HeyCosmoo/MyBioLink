<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Snap+ | Sign in</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form" autocomplete="on">
      <p class="login-brand">Snap+</p>
      <h1>Sign in</h1>
      <p class="login-sub">Enter your username and password to continue.</p>
      <div id="error" class="alert alert-error hidden"></div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" required="" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required="" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>
  <script>
    (async () => {
      try {
        const me = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (me.ok) location.href = '/dashboard';
      } catch (_) {}
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const btn = document.getElementById('submit-btn');
      err.classList.add('hidden');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.error || 'Login failed';
          err.classList.remove('hidden');
          btn.disabled = false;
          return;
        }
        location.href = '/dashboard';
      } catch (_) {
        err.textContent = 'Network error';
        err.classList.remove('hidden');
        btn.disabled = false;
      }
    });
  </script>
