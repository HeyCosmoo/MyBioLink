<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cosmo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Entry page styles */
    #entry-page {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10000;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    body {
      margin: 0;
      background-color: black;
      overflow: hidden;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    /* Video background (initially hidden) */
    #video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      display: none;
      filter: grayscale(100%);
    }

    #redirect-text {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      font-weight: 500; 
      cursor: pointer;
      color: #555555;
      font-family: 'Cinzel', serif;
      text-shadow: 0 0 3px #555555, 0 0 5px #555555, 0 0 10px #555555;
      transition: all 0.4s ease-in-out;
      z-index: 1500;
      padding: 10px 20px;
      opacity: 0;
      animation: fadeIn 2s ease forwards, smoothGlow 3.5s ease-in-out infinite;
      text-align: center;
    }

    #redirect-text:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }

    @keyframes smoothGlow {
      0%, 100% { text-shadow: 0 0 3px #555555, 0 0 5px #555555, 0 0 10px #555555; }
      50% { text-shadow: 0 0 5px #555555, 0 0 10px #555555, 0 0 15px #555555; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    #terminal {
      position: fixed; 
      inset: 0; 
      background: black; 
      color: #999;
      font-family: 'Courier New', monospace; 
      font-size: 1.2rem;
      display: flex; 
      justify-content: center; 
      align-items: center;
      flex-direction: column; 
      gap: 1rem; 
      user-select: none; 
      z-index: 1000;
    }

    #code-messages {
      position: absolute; 
      top: 1rem; 
      right: 1rem;
      font-size: 0.9rem; 
      color: #666; 
      text-align: right; 
      white-space: pre-line;
    }

    #typewriter-container { 
      white-space: nowrap; 
      overflow: hidden; 
    }
    
    .cursor { 
      animation: blink 1s step-start infinite; 
    }
    
    @keyframes blink {
      0%,50%,100% { opacity: 1; }
      25%,75% { opacity: 0; }
    }

    @keyframes screenBlur {
      0%   { filter: blur(0px); opacity: 1; }
      100% { filter: blur(12px); opacity: 0; }
    }
    
    .terminal-blur-out {
      animation: screenBlur 1.5s ease forwards;
    }
    
    /* Bio page styles (initially hidden) */
    #bio-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .bio-content {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    
    /* Bio page specific styles */
    .container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile-card {
      background: rgba(15, 15, 15, 0.8);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid #333;
      position: relative;
      backdrop-filter: blur(10px);
      width: 100%;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
    }

    .profile-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #333;
      margin: 0 auto 20px;
      display: block;
      position: relative;
      z-index: 1;
      filter: grayscale(100%) contrast(120%);
      transition: filter 0.3s ease;
    }

    .profile-img:hover {
      filter: grayscale(50%) contrast(120%);
    }

    .profile-name {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
      color: #fff;
      text-transform: uppercase;
    }

    .profile-bio {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 25px;
      line-height: 1.6;
      position: relative;
      z-index: 1;
      animation: float 3s ease-in-out infinite;
      font-style: italic;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
     50% {
        transform: translateY(-5px);
      }
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
    }

    .social-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      font-size: 22px;
      transition: all 0.3s ease;
      text-decoration: none;
      border: 1px solid #333;
      filter: grayscale(100%);
    }

    .social-icon:hover {
      background: #222;
      transform: translateY(-5px) scale(1.1);
      filter: grayscale(0%);
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
    }

    /* Compact Music Player Styles - Now separate from profile card */
    .music-player-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .music-player {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      padding: 15px;
      border: 1px solid #333;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      width: 85%;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      filter: grayscale(100%);
      text-align: center;
    }

    .music-player:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.8);
      filter: grayscale(50%);
    }

    .music-player::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #fff, #aaa, #fff);
      background-size: 200% 100%;
      animation: gradientFlow 3s linear infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .song-info {
      text-align: center;
      margin-bottom: 12px;
    }

    .song-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 3px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .song-artist {
      font-size: 12px;
      color: #aaa;
      font-weight: 500;
      font-style: italic;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .player-btn {
      background: linear-gradient(145deg, #111, #0a0a0a);
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid #333;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
      filter: grayscale(100%);
    }

    .player-btn:hover {
      background: linear-gradient(145deg, #222, #111);
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
      filter: grayscale(0%);
    }

    .progress-container {
      width: 100%;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fff, #aaa);
      border-radius: 2px;
      transition: width 0.1s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      font-family: 'Courier New', monospace;
      width: 100%;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      align-items: center;
    }

    .link-item {
      background: rgba(15, 15, 15, 0.8);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: #e0e0e0;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      backdrop-filter: blur(5px);
      filter: grayscale(100%);
      width: 100%;
      max-width: 350px;
      justify-content: center;
    }

    .link-item:hover {
      background: rgba(21, 21, 21, 0.9);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      filter: grayscale(0%);
    }

    .link-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .link-text {
      flex: 1;
      font-weight: 500;
      font-size: 16px;
      text-align: center;
    }

    .link-arrow {
      font-size: 18px;
      color: #666;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 20px;
      }
      
      .profile-img {
        width: 120px;
        height: 120px;
      }
      
      .profile-name {
        font-size: 28px;
      }
      
      .social-icon {
        width: 45px;
        height: 45px;
        font-size: 20px;
      }
      
      .player-btn {
        width: 32px;
        height: 32px;
      }
      
      #redirect-text {
        font-size: 1.8rem;
      }
      
      .music-player {
        padding: 12px;
        width: 90%;
      }
      
      .song-title {
        font-size: 15px;
      }
      
      .song-artist {
        font-size: 11px;
      }
    }
  </style>
</head>

  <script>
    // ===== ENTRY PAGE FUNCTIONALITY =====
    // Matrix Effect
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.zIndex = '0';
    canvas.style.pointerEvents = 'none';

    const cols = Math.floor(canvas.width / 20) + 1;
    const drops = Array(cols).fill(0);
    const letters = "abcdefghijklmnopqrstuvwxyz0123456789".split("");
    let fadeOut = false;

    function drawMatrix() {
      ctx.fillStyle = "rgba(0,0,0,0.1)"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#555";
      ctx.font = "16px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * 20, drops[i] * 20);
        drops[i]++;
        if (drops[i] * 20 > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
      }

      if (fadeOut) {
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    const matrixInterval = setInterval(drawMatrix, 50);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    function fadeMatrixEffect(duration = 1500) {
      fadeOut = true;
      const start = performance.now();

      function fadeStep(now) {
        const progress = (now - start) / duration;
        ctx.fillStyle = `rgba(0,0,0,${progress * 0.1})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (progress < 1) requestAnimationFrame(fadeStep);
        else clearInterval(matrixInterval);
      }
      requestAnimationFrame(fadeStep);
    }

    // Images + Terminal
    const randomImages = [
      // Your image URLs would go here
    ];

    const GAP = 120;
    function addRandomImages(gap = GAP) {
      const redirectText = document.getElementById('redirect-text');
      const textRect = redirectText.getBoundingClientRect();

      const imgW = 120;
      const imgH = 120;
      const maxLeft = Math.max(0, window.innerWidth - imgW - 10);
      const maxTop  = Math.max(0, window.innerHeight - imgH - 10);

      randomImages.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        img.className = "random-image";

        let left, top, attempts = 0;
        function isInsideTextZone(l, t) {
          return !( (l + imgW) < (textRect.left - gap) ||
                    l > (textRect.right + gap) ||
                    (t + imgH) < (textRect.top - gap) ||
                    t > (textRect.bottom + gap) );
        }

        do {
          left = Math.random() * maxLeft;
          top = Math.random() * maxTop;
          attempts++;
        } while (isInsideTextZone(left, top) && attempts < 300);

        img.style.left = left + "px";
        img.style.top = top + "px";
        document.body.appendChild(img);
      });
    }

    const codeMessages = [
      "Initializing kernel...",
      "Loading modules...",
      "Checking hardware...",
      "Starting services...",
      "Loading user profile...",
      "Connecting to database...",
      "Fetching user data...",
      "Loading UI components...",
      "Applying user settings...",
      "Establishing secure connection...",
      "Optimizing assets...",
      "Starting frontend engine...",
      "Rendering interface...",
      "Finalizing setup...",
      "3 - Launching this bitch...",
      "2 - Launching this bitch...",
      "1 - Launching this bitch..."
    ];

    const codeMsgEl = document.getElementById('code-messages');
    let codeIndex = 0;
    function showCodeMessages() {
      if (codeIndex < codeMessages.length) {
        codeMsgEl.textContent = codeMessages.slice(0, codeIndex + 1).join('\n');
        codeIndex++;
        setTimeout(showCodeMessages, 175);
      }
    }
    showCodeMessages();

    setTimeout(() => {
      codeMsgEl.textContent = '';
      const text = 'loading...';
      const typewriter = document.getElementById('typewriter');
      let i = 0;
      function type() {
        if (i < text.length) {
          typewriter.textContent += text.charAt(i);
          i++;
          setTimeout(type, 175);
        } else {
          setTimeout(() => {
            // Blur + fade terminal
            const terminal = document.getElementById('terminal');
            terminal.classList.add('terminal-blur-out');

            // Show redirect text after fade completes
            setTimeout(() => {
              terminal.style.display = 'none';
              const redirectText = document.getElementById('redirect-text');
              redirectText.style.display = 'block';
              // addRandomImages(); // Uncomment if you want images
            }, 1500);
          }, 500);
        }
      }
      type();
    }, 1000);

    // Click handler for redirect text
    document.getElementById('redirect-text').addEventListener('click', () => {
      // Fade out the entry page
      const entryPage = document.getElementById('entry-page');
      entryPage.style.opacity = '0';
      entryPage.style.transition = 'opacity 1s ease';
      
      // Show the bio page after fade out
      setTimeout(() => {
        entryPage.style.display = 'none';
        document.getElementById('bio-page').style.display = 'flex';
        
        // Show video background
        document.getElementById('video-background').style.display = 'block';
        
        // Start the music after page transition
        initBioPage();
      }, 1000);
    });

    // ===== BIO PAGE FUNCTIONALITY =====
    function initBioPage() {
      // Background music functionality
      const bgMusic = document.getElementById('background-music');
      const playBtn = document.getElementById('play-button');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const currentTimeEl = document.getElementById('current-time');
      const durationEl = document.getElementById('duration');
      
      let isPlaying = false;
      
      // Format time function (convert seconds to mm:ss)
      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }
      
      // Update progress bar
      function updateProgress() {
        if (bgMusic) {
          const { duration, currentTime } = bgMusic;
          if (duration) {
            // Update progress bar width
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            // Update time display
            currentTimeEl.textContent = formatTime(currentTime);
            durationEl.textContent = formatTime(duration);
          } else {
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';
          }
        }
      }
      
      // Set progress bar on click
      function setProgress(e) {
        if (bgMusic && bgMusic.duration) {
          const width = this.clientWidth;
          const clickX = e.offsetX;
          const duration = bgMusic.duration;
          bgMusic.currentTime = (clickX / width) * duration;
        }
      }
      
      // Play/Pause functionality
      function togglePlay() {
        if (bgMusic) {
          if (isPlaying) {
            bgMusic.pause();
            playBtn.querySelector('i').classList.remove('fa-pause');
            playBtn.querySelector('i').classList.add('fa-play');
          } else {
            bgMusic.play().catch(e => {
              console.log("Audio play failed: ", e);
            });
            playBtn.querySelector('i').classList.remove('fa-play');
            playBtn.querySelector('i').classList.add('fa-pause');
          }
          isPlaying = !isPlaying;
        }
      }
      
      // Set initial volume
      if (bgMusic) {
        bgMusic.volume = 0.5;
      }
      
      // Add event listeners for music player
      if (playBtn) {
        playBtn.addEventListener('click', togglePlay);
      }
      
      if (bgMusic) {
        bgMusic.addEventListener('timeupdate', updateProgress);
        bgMusic.addEventListener('ended', () => {
          if (playBtn) {
            playBtn.querySelector('i').classList.remove('fa-pause');
            playBtn.querySelector('i').classList.add('fa-play');
          }
          isPlaying = false;
        });
        bgMusic.addEventListener('loadedmetadata', updateProgress);
      }
      
      if (progressContainer) {
        progressContainer.addEventListener('click', setProgress);
      }
      
      // Add hover effects to links
      const linkItems = document.querySelectorAll('.link-item');
      if (linkItems.length) {
        linkItems.forEach(item => {
          item.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-3px)';
            this.style.boxShadow = '0 6px 12px rgba(0, 0, 0, 0.4)';
          });
          
          item.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
            this.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.3)';
          });
        });
      }
      
      // Auto-play music when page loads
      if (bgMusic) {
        // Try to play automatically
        const playPromise = bgMusic.play();
        
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              // Autoplay started successfully
              isPlaying = true;
              if (playBtn) {
                playBtn.querySelector('i').classList.remove('fa-play');
                playBtn.querySelector('i').classList.add('fa-pause');
              }
            })
            .catch(error => {
              // Autoplay was prevented
              console.log("Autoplay prevented: ", error);
              isPlaying = false;
              if (playBtn) {
                playBtn.querySelector('i').classList.remove('fa-pause');
                playBtn.querySelector('i').classList.add('fa-play');
              }
            });
        }
      }
    }
  </script>
</body>
</html>
