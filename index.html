    <!-- Robust video autoplay script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('background-video');
            
            if (video) {
                // Prevents potential race condition where video isn't ready
                var startVideo = function() {
                    var playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.then(function() {
                            console.log('Video playing successfully');
                        }).catch(function(error) {
                            console.log('Video play failed: ', error);
                            // Fallback: Show a poster or handle error gracefully
                        });
                    }
                };

                // Attempt to play immediately if possible
                startVideo();
                
                // Additional backup for any residual autoplay restrictions
                document.body.addEventListener('click', function() {
                    if (video.paused) {
                        startVideo();
                    }
                }, { once: true });
            } else {
                console.error('Video element not found');
            }
        });
    </script>
    
    <script language=javascript>
        var rev = "fwd";
        function titlebar(val){
            var msg  = "Cosmo ╰（‵□′）╯";
            var res = " ";
            var speed = 400;
            var pos = val;
            var le = msg.length;
            if(rev == "fwd"){
                if(pos < le){
                    pos = pos+1;
                    scroll = msg.substr(0,pos);
                    document.title = scroll;
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
                else {
                    rev = "bwd";
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
            }
            else {
                if(pos > 0) {
                    pos = pos-1;
                    var ale = le-pos;
                    scrol = msg.substr(ale,le);
                    document.title = scrol;
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
                else {
                    rev = "fwd";
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
            }
        }
        titlebar(0);
