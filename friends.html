<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cosmo's Biolink">
    <meta name="keywords" content="cosmo, HCF, minecraft, Biolink">
    <link rel="stylesheet" href="assets/stylesheets/icons.css">
    <link rel="stylesheet" href="assets/stylesheets/style.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="32x32" href="assets/images/favicon-32x32.png" type="image/png">
    <link rel="icon" sizes="16x16" href="assets/images/favicon-16x16.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" type="image/png">
    <link rel="icon" sizes="192x192" href="assets/images/android-chrome-192x192.png" type="image/png">
    <link rel="icon" sizes="512x512" href="assets/images/android-chrome-512x512.png" type="image/png">
    <link rel="stylesheet" href="assets/stylesheets/audio-control.css">
    <title>Cosmo - Friends</title>
    <style>
        /* Make the "Friends" heading bigger */
        .g h1 {
            font-size: 3rem !important;
        }
        /* Make each friend link larger */
        .g a {
            font-size: 1.8rem !important;
            margin: 10px 15px;
            display: inline-block;
            transition: transform 0.2s;
        }
        .g a:hover {
            transform: scale(1.05);
            color: #ffcc00 !important;
        }
        #line {
            max-width: 400px;
            margin: 20px auto;
        }
        .g > div {
            gap: 10px;
            justify-content: center;
        }
        /* Overlay and video background styles */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            z-index: 10000;
            transition: opacity 0.8s ease;
        }
        #overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        body {
            background-color: black;
        }

        /* ----- Simple "Back" link - no extra styling, just plain text ----- */
        .back-link {
            font-size: 1.6rem;
            font-weight: 500;
            color: white;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-block;
            font-family: inherit;
        }
        .back-link:hover {
            color: #ffcc00;
        }
        /* Navigation container: keeps Back at left top, no extra roundness or background */
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 5% 10px 5%;
            flex-wrap: wrap;
        }
        @media (max-width: 680px) {
            .nav-container {
                padding: 18px 5% 8px 5%;
            }
            .back-link {
                font-size: 1.4rem;
            }
        }
        /* Keep rest of the page consistent */
        footer {
            padding: 16px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- initial overlay: click to enter -->
    <div id="overlay">
        <p><i>Click to Enter</i></p>
    </div>

    <!-- background video immersive -->
    <video autoplay loop muted playsinline id="background-video" preload="auto">
        <source src="https://files.catbox.moe/th9hgz.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- background music -->
    <audio loop id="audio">
        <source src="House.mp3" type="audio/mp3">
    </audio>

    <!-- audio control panel -->
    <div class="audio-control">
        <button id="mute-button" aria-label="Mute"></button>
        <div class="slider-container">
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.3">
        </div>
    </div>

    <!-- Header with plain "Back" link to index.html -->
    <header id="entrypoint">
        <nav>
            <div class="nav-container">
                <!-- simple text link: no background, no border, no extra "thing" -->
                <a href="index.html" class="back-link">Back</a>
            </div>
        </nav>
    </header>

    <!-- Friends section -->
    <section>
        <div class="g">
            <h1 style="font-size:24px;margin-bottom: 0;font-weight: 400;">Friends</h1>
            <div id="line" style="border-bottom: 1px solid #e5ebf1; max-width: 400px; margin: 16px; width: 100%;"></div>
            <div style="flex-wrap: wrap; display: flex; margin: 0; justify-content: center;">
                <a href="https://slat.cc/toxi" target="_blank" style="color: rgb(255, 255, 255);">Ionut</a>
                <a href="https://guns.lol/oq" target="_blank" style="color: rgb(255, 255, 255);">Oq</a>
                <a href="https://guns.lol/clean" target="_blank" style="color: rgb(255, 255, 255);">Noah</a>
                <a href="https://kuhaku.world/" target="_blank" style="color: rgb(255, 255, 255)">Kuhaku</a>
            </div>
        </div>
    </section>

    <footer></footer>

    <!-- external scripts (overlay & audio) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="assets/js/overlay.js"></script>
    <script src="assets/js/mute-button.js"></script>

    <!-- overlay click to unmute video+audio -->
    <script>
        (function() {
            const overlay = document.getElementById('overlay');
            const video = document.getElementById('background-video');
            const audio = document.getElementById('audio');
            if (overlay && video && audio) {
                overlay.addEventListener('click', function() {
                    video.play().catch(e => console.log('Video play error:', e));
                    audio.play().catch(e => console.log('Audio play error:', e));
                    overlay.classList.add('fade-out');
                    setTimeout(() => { overlay.style.display = 'none'; }, 800);
                });
            }
        })();
    </script>

    <!-- animated title effect -->
    <script language="javascript">
        var rev = "fwd";
        function titlebar(val){
            var msg  = "COSMO";
            var speed = 500;
            var pos = val;
            var le = msg.length;
            if(rev == "fwd"){
                if(pos < le){
                    pos = pos+1;
                    scroll = msg.substr(0,pos);
                    document.title = scroll;
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
                else {
                    rev = "bwd";
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
            }
            else {
                if(pos > 0) {
                    pos = pos-1;
                    var ale = le-pos;
                    scrol = msg.substr(ale,le);
                    document.title = scrol;
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
                else {
                    rev = "fwd";
                    timer = window.setTimeout("titlebar("+pos+")",speed);
                }
            }
        }
        titlebar(0);
    </script>
</body>
</html>
